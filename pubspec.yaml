name: studymate_ai
description: "StudyMate AI - Premium Android app for students to study smarter with AI."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_remote_config: ^5.1.4
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_app_check: ^0.3.1+3
  firebase_ai: ^2.1.0
  google_sign_in: ^6.2.1

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.69.2
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  flutter_markdown: ^0.7.4+1

  # Device
  image_picker: ^1.1.2
  file_selector: ^1.1.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.0
  timezone: ^0.10.1

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.3
  uuid: ^4.5.1
  equatable: ^2.0.5
  collection: ^1.18.0
  shared_preferences: ^2.3.2

  # Animations
  confetti: ^0.8.0

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/

  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon-1024.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon-1024.png"
    background_color: "#6C5CE7"
    theme_color: "#6C5CE7"
  windows:
    generate: true
    image_path: "assets/icon/icon-1024.png"
    icon_size: 48
  macos:
    generate: false

flutter_native_splash:
  color: "#0B0D17"
  color_dark: "#0B0D17"
  image: "assets/icon/icon-1024.png"
  image_dark: "assets/icon/icon-1024.png"
  android_12:
    image: "assets/icon/icon-1024.png"
    image_dark: "assets/icon/icon-1024.png"
    color: "#0B0D17"
    color_dark: "#0B0D17"
  ios: true
  web: false